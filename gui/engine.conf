# Absolute executable and working directory, without shell arguments.
Engine=/shogi
EngineDir=/
# Every other key=value is sent as a USI setoption after usiok.
# The repository engine calls its hash option USI_Hash (other engines may differ).
USI_Hash=2
Threads=1
USI_Ponder=false
USI_OwnBook=false
EnteringKingRule=CSARule27
